<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de moedas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
    <h1>Conversor de moedas</h1>
    <h2>Uso de API pública credenciada: FrankFurter</h2>
    <form id="form">
        <label>Valor a converter:</label>
        <input type="number" id="quantidade" value="1" min="0.01" step="0.01">

        <label>Moeda de Origem:</label>
        <select id="moedaInicial">
            <option value="BRL" selected>BRL - Real Brasileiro</option>
            <option value="USD">USD - Dólar Americano</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Libra Esterlina</option>
            <option value="ARS">ARS - Peso Argentino</option>
            <option value="JPY">JPY - Iene Japonês</option>
            <option value="CAD">CAD - Dólar Canadense</option>
        </select>

        <label>Moeda de Destino:</label>
        <select id="moedaFinal">
            <option value="BRL">BRL - Real Brasileiro</option>
            <option value="USD" selected>USD - Dólar Americano</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Libra Esterlina</option>
            <option value="ARS">ARS - Peso Argentino</option>
            <option value="JPY">JPY - Iene Japonês</option>
            <option value="CAD">CAD - Dólar Canadense</option>
        </select>

        <button type="button" id="botao" class="btn btn-primary">Converter</button>
    </form>
    <article id="resultado">
        
    </article>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
