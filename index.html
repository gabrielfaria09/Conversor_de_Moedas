<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de moedas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold text-center mb-4">💱 Conversor de moedas</h1>

            <form id="form">
              <div class="form-floating mb-3">
                <input type="number" class="form-control" id="quantidade" value="1" min="0.01" step="0.01">
                <label for="quantidade">Valor a converter</label>
              </div>

              <div class="row g-2 align-items-center mb-4">
                <div class="col">
                  <div class="form-floating">
                    <select class="form-select" id="moedaInicial">
                    <option value="BRL" selected>BRL - Real Brasileiro</option>
                    <option value="USD">USD - Dólar Americano</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - Libra Esterlina</option>
                    <option value="ARS">ARS - Peso Argentino</option>
                    <option value="JPY">JPY - Iene Japonês</option>
                    <option value="CAD">CAD - Dólar Canadense</option>
                    </select>
                    <label for="moedaInicial">De</label>
                  </div>
                </div>
                <div class="col-auto">
                  <button type="button" id="trocar" class="btn btn-outline-secondary rounded-circle">⇄</button>
                </div>
                <div class="col">
                  <div class="form-floating">
                    <select class="form-select" id="moedaFinal">
                      <option value="BRL" selected>BRL - Real Brasileiro</option>
                <option value="USD">USD - Dólar Americano</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - Libra Esterlina</option>
                <option value="ARS">ARS - Peso Argentino</option>
                <option value="JPY">JPY - Iene Japonês</option>
                <option value="CAD">CAD - Dólar Canadense</option>
                    </select>
                    <label for="moedaFinal">Para</label>
                  </div>
                </div>
              </div>

              <button type="button" id="botao" class="btn btn-primary btn-lg w-100">Converter</button>
            </form>

            <article id="resultado" class="mt-4 text-center"></article>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
